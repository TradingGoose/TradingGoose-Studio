name: Build and Push Images

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-and-push-images
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-images:
    name: Build Images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Only the app image is mirrored to Docker Hub; migrations carries the
          # database schema and realtime is only ever pulled alongside it, so both
          # stay on GHCR where private packages are free.
          - dockerfile: ./docker/app.Dockerfile
            repo: tradinggoose
            dockerhub: true
          - dockerfile: ./docker/db.Dockerfile
            repo: migrations
          - dockerfile: ./docker/realtime.Dockerfile
            repo: realtime

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/main' && matrix.dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate tags
        id: meta
        env:
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_USERNAME }}
          PUSH_DOCKERHUB: ${{ matrix.dockerhub }}
        run: |
          set -euo pipefail

          repo="${{ matrix.repo }}"
          owner="${{ github.repository_owner }}"
          # GHCR rejects uppercase in image paths, and the owner may be mixed case.
          ghcr_image="ghcr.io/${owner,,}/${repo}"
          sha_tag="${{ github.sha }}"
          tags=("${ghcr_image}:${sha_tag}")

          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            tags+=("${ghcr_image}:latest")

            if [ "${PUSH_DOCKERHUB:-}" = "true" ]; then
              if [ -z "${DOCKERHUB_NAMESPACE:-}" ]; then
                echo "::error::DOCKERHUB_USERNAME variable is not set; cannot build Docker Hub tags." >&2
                exit 1
              fi
              dockerhub_image="docker.io/${DOCKERHUB_NAMESPACE}/${repo}"
              tags+=("${dockerhub_image}:${sha_tag}")
              tags+=("${dockerhub_image}:latest")
            fi
          fi

          tags_csv=$(IFS=,; printf '%s' "${tags[*]}")
          echo "tags=${tags_csv}" >> "$GITHUB_OUTPUT"
          printf 'Tagging:\n%s\n' "${tags[*]}"

      - name: Build and push images
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.repo }}
          cache-to: type=gha,mode=max,scope=${{ matrix.repo }}
          provenance: true
          sbom: true
